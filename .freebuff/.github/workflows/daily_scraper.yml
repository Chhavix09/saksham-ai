name: Daily scheme scraper

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  scrape-schemes:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: .freebuff/backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Run scraper script
        working-directory: .freebuff/backend
        run: |
          python -m services.scheme_scraper

      - name: Commit and push updated database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .freebuff/backend/sakshamai.db .freebuff/backend/schemes.json
          git commit -m "Auto-update government schemes [daily cron]" || exit 0
          git push